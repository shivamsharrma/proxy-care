# Static analysis for the Proxy Care client.
#
# Base rules come from flutter_lints. The strict language modes turn implicit
# dynamic casts, missing type inference and raw generic types into errors.
include: package:flutter_lints/flutter.yaml

formatter:
  # Keep trailing commas the author writes. Together with
  # require_trailing_commas this gives one convention: a split argument or
  # parameter list always ends with a trailing comma.
  trailing_commas: preserve

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - lib/core/l10n/generated/**
    - web/**
    - android/**
    - ios/**

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    prefer_single_quotes: true
    require_trailing_commas: true
