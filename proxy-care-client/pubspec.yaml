name: proxy_care_client
description: "Proxy Care client application (Flutter Web)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logger: ^2.8.0
  material_ui: ^1.11.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/core/l10n/arb (see l10n.yaml).
  generate: true
  # Only Devanagari is bundled; Latin text uses the platform's own font.
  # Static instances (wdth 100) of Noto Sans Devanagari v2.007, SIL OFL 1.1;
  # licence in assets/fonts/noto_sans_devanagari/OFL.txt.
  fonts:
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/noto_sans_devanagari/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto_sans_devanagari/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/noto_sans_devanagari/NotoSansDevanagari-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/noto_sans_devanagari/OFL.txt
