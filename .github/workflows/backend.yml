name: Backend

# Builds and tests proxy-care-backend. Testcontainers uses the runner's Docker.

on:
  push:
    paths:
      - "proxy-care-backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "proxy-care-backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: proxy-care-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: proxy-care-backend/build/reports/tests/
          retention-days: 14
