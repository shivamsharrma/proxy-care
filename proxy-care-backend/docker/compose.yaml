# Local development database only. Tests do not use this file: they start their own
# Testcontainers database with the same image and init script. Start with `make db-up`
# (reads ../.env). The init script runs only on an empty volume: after changing it, run
# `make db-reset`.
#
# The image must match PostgresTestcontainersConfiguration and the Supabase PostgreSQL
# major version (ARCHITECTURE.md, open decision U12).

name: proxy-care-backend

services:
  postgres:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      POSTGRES_DB: proxycare
      # Container superuser: administration only, never used by the application.
      POSTGRES_USER: proxycare_admin
      POSTGRES_PASSWORD: ${PROXYCARE_DB_ADMIN_PASSWORD:?set PROXYCARE_DB_ADMIN_PASSWORD in .env}
      PROXYCARE_DB_PASSWORD: ${PROXYCARE_DB_PASSWORD:?set PROXYCARE_DB_PASSWORD in .env}
      PROXYCARE_DB_MIGRATOR_PASSWORD: ${PROXYCARE_DB_MIGRATOR_PASSWORD:?set PROXYCARE_DB_MIGRATOR_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/setup:/proxycare-setup:ro
      - ./postgres/init/20-proxycare.sh:/docker-entrypoint-initdb.d/20-proxycare.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxycare_admin -d proxycare"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
