# The database comes from the Testcontainers @ServiceConnection; everything here is clearly fake.
spring:
  flyway:
    locations: classpath:db/migration, classpath:db/testmigration

proxycare:
  security:
    jwt:
      supabase-url: https://test.supabase.co
  razorpay:
    key-id: rzp_test_fake
    key-secret: test-key-secret
    webhook-secret: test-webhook-secret
  # Port 9 (discard) on localhost: nothing answers, so no test can reach a real vendor by accident.
  razorpay-ifsc:
    base-url: http://localhost:9
  razorpayx:
    base-url: http://localhost:9
    account-number: "0000000000000000"
    webhook-secret: test-razorpayx-webhook-secret
    name-match-threshold: 70
  # Clearly fake: base64 of "test-only-bank-account-key-32b!!".
  crypto:
    bank-account-encryption-key: dGVzdC1vbmx5LWJhbmstYWNjb3VudC1rZXktMzJiISE=
  # Jobs don't run on a timer in tests; a test calls the job directly.
  scheduling:
    enabled: false
  google:
    maps-api-key: test-maps-key
  uber:
    client-id: test-uber-client
    client-secret: test-uber-secret

# Plain-text logs (no structured format) and Swagger on.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Short so IdempotencyConcurrencyTest sees a blocked duplicate time out quickly; fast actions never wait this long.
proxycare.idempotency.lock-timeout: 500ms
