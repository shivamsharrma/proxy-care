# Tests must not depend on execution order (docs/TESTING.md).
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random

# A hung test (for example a deadlocked concurrency test) fails instead of stalling the build.
junit.jupiter.execution.timeout.testable.method.default=60 s
