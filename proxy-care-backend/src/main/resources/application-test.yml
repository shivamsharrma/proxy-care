# Automated tests (docs/TESTING.md).
#
# - Database: a dedicated PostGIS container per test JVM (PostgresTestcontainersConfiguration),
#   never a local or shared database. Flyway runs every production migration plus the
#   test-only fixtures in src/test/resources/db/test-migration.
# - Time: tests that need control import ClockTestConfiguration (fixed, adjustable clock).
# - Vendors: none are called. Outbound HTTP goes to WireMock; any other host is refused by the
#   proxy guard set on the Gradle test task.
# - Scheduled jobs are off; a test that needs one starts it explicitly.

proxycare:
  environment: test
  jobs:
    enabled: false

spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      leak-detection-threshold: 20000
  flyway:
    locations: classpath:db/migration,classpath:db/test-migration

management:
  tracing:
    sampling:
      probability: 1.0

springdoc:
  # The test-only probe API (src/test, in.proxycare.support) is not part of the documented API.
  packages-to-exclude: in.proxycare.support
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    in.proxycare: INFO
