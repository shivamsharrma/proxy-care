# Developer machine. Database: docker/compose.yaml (`make db-up`).
# Credentials come from the git-ignored .env file (copy .env.example), never from this file.

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${PROXYCARE_DB_URL:jdbc:postgresql://localhost:5432/proxycare}
    username: ${PROXYCARE_DB_USERNAME}
    password: ${PROXYCARE_DB_PASSWORD}
    hikari:
      leak-detection-threshold: 20000
  flyway:
    # Locally, migrations run at start-up as the schema owner (deployed environments run them
    # as a separate step).
    user: ${PROXYCARE_DB_MIGRATOR_USERNAME}
    password: ${PROXYCARE_DB_MIGRATOR_PASSWORD}

proxycare:
  environment: local

management:
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    in.proxycare: DEBUG
