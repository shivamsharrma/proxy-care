# Settings shared by every profile. Exactly one of the profiles local, test, staging or
# prod must be active; the profile sets proxycare.environment and start-up fails otherwise
# (DeploymentConfigurationValidator). Secrets never appear here: deployed environments
# read them from environment variables.

spring:
  application:
    name: proxy-care-backend
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true # ADR 0010
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # JSON conventions, central for the whole API (ADR 0012): camelCase properties (Jackson's
  # default), ISO-8601 UTC instants with an offset ("Z"), strict input.
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true # ADR 0012: typos must not be ignored
      fail-on-null-for-primitives: true
      accept-float-as-int: false # money is integer paise; 10.5 must not become 10

  # Connection modes, pool sizing and roles: docs/DATABASE.md. The application always connects
  # as proxycare_app (never postgres or service_role).
  datasource:
    hikari:
      pool-name: proxycare
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000 # ms to wait for a pooled connection
      validation-timeout: 3000
      idle-timeout: 600000
      # Below Supavisor's and Postgres' idle cut-offs so the pool, not the server, retires
      # connections.
      max-lifetime: 1500000
      keepalive-time: 300000
      data-source-properties:
        ApplicationName: proxy-care-backend

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; DeploymentConfigurationValidator rejects create/update
    properties:
      hibernate:
        default_schema: proxycare
        jdbc:
          time_zone: UTC

  transaction:
    default-timeout: 30s

  mvc:
    # GlobalExceptionHandler writes every problem response; Boot's own handler stays off.
    problemdetails:
      enabled: false
  web:
    resources:
      # An API serves no static files; unknown paths become 404 problems.
      add-mappings: false
  servlet:
    multipart:
      enabled: false # ADR 0012: files go to Supabase Storage through signed URLs

  flyway:
    enabled: true
    schemas: proxycare
    default-schema: proxycare
    # The schema and roles come from database/setup/roles.sql, never from Flyway.
    create-schemas: false
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: 0.1
  # No observability backend has been chosen yet (ARCHITECTURE.md U9): nothing is exported.
  # Trace and span ids are still created and appear in logs.
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

springdoc:
  api-docs:
    enabled: false
    version: openapi_3_1
  swagger-ui:
    enabled: false
  # Only the application's API under /api/v1 is documented (ADR 0012).
  packages-to-scan: in.proxycare
  paths-to-match: /api/v1/**
  # Keep the shared contract schemas (PageMetadata...) even while no operation references them.
  remove-broken-reference-definitions: false

proxycare:
  api:
    max-request-body-size: 1MB # ADR 0012; larger bodies get 413
    default-retry-after: 5s # Retry-After for 429/503 when the cause gives no better value
  jobs:
    enabled: true
  persistence:
    # Applied to every pooled connection (DatabaseSessionSettings). A runaway query, a blocked
    # lock or a forgotten open transaction ends instead of exhausting the pool.
    statement-timeout: 30s
    lock-timeout: 10s
    idle-in-transaction-session-timeout: 60s

logging:
  level:
    root: INFO
