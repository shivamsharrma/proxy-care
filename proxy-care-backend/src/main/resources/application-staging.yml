# Staging. Every value that differs per deployment comes from an environment variable.
# Missing or unsafe values stop start-up (DeploymentConfigurationValidator).

proxycare:
  environment: staging

spring:
  datasource:
    # Must be a non-local jdbc:postgresql:// URL with sslmode=verify-full (ADR 0003).
    url: ${PROXYCARE_DB_URL:}
    username: ${PROXYCARE_DB_USERNAME:}
    password: ${PROXYCARE_DB_PASSWORD:}
  flyway:
    # Migrations run as a separate deployment step with the migrator role (ADR 0003).
    enabled: false

management:
  server:
    port: ${PROXYCARE_MANAGEMENT_PORT:8081}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  structured:
    format:
      console: ecs
