# Versions outside the Spring Boot and Spring Modulith BOMs.
# Compatibility evidence for each entry: docs/adr/0001-framework-and-version.md.
# Everything the Boot BOM manages (Hibernate, Flyway, Testcontainers, Micrometer,
# OpenTelemetry, JUnit, AssertJ, PostgreSQL driver, ...) is deliberately absent.

[versions]
spring-boot = "4.1.2"
spring-modulith = "2.1.2"
springdoc = "3.2.0"
resilience4j = "2.4.0"
bucket4j = "8.22.0"
shedlock = "7.11.0"
mapstruct = "1.6.3"
archunit = "1.5.1"
# Last stable line (4.x is beta). The standalone jar shades Jetty 11 and Jackson 2, so it
# cannot clash with Boot 4.1's Tomcat or Jackson 3.
wiremock = "3.13.2"
spotless = "8.11.0"
# Spotless 8.11 is binary-incompatible with google-java-format 1.x
# (NoSuchMethodError on JavaFormatterOptions$Style.valueOf); 2.x is required.
google-java-format = "2.0.0"
jacoco = "0.8.16"
# The foojay toolchain resolver is pinned in settings.gradle.kts: catalogs are not
# available to the settings plugins block.

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }

springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
resilience4j-spring-boot = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
shedlock-jdbc = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
